name: test
on:
  push:
  pull_request:
jobs:
  highlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # every sample tokenizes with no unrecognised text
      - run: npm test
